<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bokade möten — Commercial Insights</title>
<style>
  :root {
    --primary: #C77DCC;
    --dark: #3D1A6E;
    --bg: #F7F5FA;
    --card: #FFFFFF;
    --text: #2A1E3D;
    --muted: #8A7A9E;
    --border: #E5DEEF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 21px;
    color: var(--dark);
    margin: 0 0 2px;
  }
  .sub { color: var(--muted); font-size: 13px; }

  .total {
    background: var(--dark);
    color: white;
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    min-width: 140px;
  }
  .total .num { font-size: 24px; font-weight: 700; line-height: 1; }
  .total .lbl { font-size: 11.5px; opacity: 0.85; margin-top: 2px; }

  .board {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .col {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-width: 220px;
    max-width: 220px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    max-height: 78vh;
  }
  .col-head {
    padding: 12px 14px 10px;
    border-bottom: 2px solid var(--primary);
  }
  .col.current .col-head { border-bottom-color: var(--dark); background: #FBF3FC; border-radius: 12px 12px 0 0; }
  .col-head .wk { font-weight: 700; color: var(--dark); font-size: 14.5px; }
  .col-head .wk .yr { font-weight: 500; color: var(--muted); font-size: 12px; }
  .col-head .cnt { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .col.current .col-head .wk::after {
    content: " · nu";
    color: var(--primary);
    font-weight: 600;
    font-size: 11px;
  }

  .entries {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
  }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .entry:last-child { border-bottom: none; }
  .entry .kund { font-weight: 600; word-break: break-word; }
  .entry .meta { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .entry .del {
    background: none; border: none; color: var(--muted);
    font-size: 14px; padding: 0 2px; cursor: pointer; flex-shrink: 0;
  }
  .entry .del:hover { color: #C0392B; }

  .add-row {
    padding: 8px 10px 12px;
    border-top: 1px dashed var(--border);
  }
  .add-row input, .add-row select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    background: #FCFBFE;
    color: var(--text);
    margin-bottom: 6px;
  }
  .add-row input:focus, .add-row select:focus { outline: none; border-color: var(--primary); }
  .add-row input::placeholder { color: #C4B8D6; }
  .add-row .add-btn {
    width: 100%;
    padding: 7px 9px;
    border: none;
    border-radius: 7px;
    background: var(--dark);
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 2px;
  }
  .add-row .add-btn:hover { background: #2c1354; }

  .loading { color: var(--muted); font-size: 14px; padding: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Bokade möten</h1>
      <div class="sub">Fyll i kund direkt i rätt veckas kolumn</div>
    </div>
    <div class="total">
      <div class="num" id="totalNum">0</div>
      <div class="lbl">möten bokade totalt</div>
    </div>
  </div>

  <div class="board" id="board">
    <div class="loading">Laddar...</div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwYNMArK6i-X1FtYDCECcI-uIE2cTrHzNvHoxQ2CsPA5IQBWL3JvE4-vpjhhp_Qj619MQ/exec';
let entries = [];

function isoWeek(date) {
  const d = new Date(date.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dayNr + 3);
  const firstThursday = new Date(d.getFullYear(), 0, 4);
  const diff = d - firstThursday;
  const week = 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
  return { year: d.getFullYear(), week };
}

function mondayOfWeek(year, week) {
  const jan4 = new Date(year, 0, 4);
  const dayNr = (jan4.getDay() + 6) % 7;
  const mondayWeek1 = new Date(jan4);
  mondayWeek1.setDate(jan4.getDate() - dayNr);
  const monday = new Date(mondayWeek1);
  monday.setDate(mondayWeek1.getDate() + (week - 1) * 7);
  return monday;
}

function currentWeek() {
  return isoWeek(new Date());
}

function weekKey(year, week) { return year + '-W' + String(week).padStart(2, '0'); }

function addWeeks(year, week, n) {
  const d = mondayOfWeek(year, week);
  d.setDate(d.getDate() + n * 7);
  return isoWeek(d);
}

async function loadEntries() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    return data.map(e => ({
      id: e.id, kund: e.kund, bokadAv: e.bokadAv,
      year: Number(e.year), week: Number(e.week)
    }));
  } catch (e) {
    console.error('Kunde inte hämta möten', e);
    return null;
  }
}

async function addEntryRemote(entry) {
  await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'add', ...entry })
  });
}

async function deleteEntryRemote(id) {
  await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'delete', id })
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function getColumnRange() {
  const cw = currentWeek();
  let start = addWeeks(cw.year, cw.week, -1);
  let end = addWeeks(cw.year, cw.week, 7);

  entries.forEach(e => {
    const k = e.year + e.week / 100;
    const startVal = start.year + start.week / 100;
    const endVal = end.year + end.week / 100;
    if (k < startVal) start = { year: e.year, week: e.week };
    if (k > endVal) end = { year: e.year, week: e.week };
  });

  const cols = [];
  let cur = start;
  let guard = 0;
  while (guard < 60) {
    cols.push(cur);
    if (cur.year === end.year && cur.week === end.week) break;
    cur = addWeeks(cur.year, cur.week, 1);
    guard++;
  }
  return cols;
}

function render() {
  document.getElementById('totalNum').textContent = entries.length;

  const board = document.getElementById('board');
  const cw = currentWeek();
  const cols = getColumnRange();

  board.innerHTML = cols.map(({ year, week }) => {
    const key = weekKey(year, week);
    const items = entries.filter(e => weekKey(e.year, e.week) === key);
    const isCurrent = year === cw.year && week === cw.week;

    const rows = items.map(item => `
      <div class="entry">
        <div>
          <div class="kund">${escapeHtml(item.kund)}</div>
          <div class="meta">${escapeHtml(item.bokadAv)}</div>
        </div>
        <button class="del" data-id="${item.id}" title="Ta bort">✕</button>
      </div>
    `).join('');

    return `
      <div class="col ${isCurrent ? 'current' : ''}" data-year="${year}" data-week="${week}">
        <div class="col-head">
          <div class="wk">Vecka ${week} <span class="yr">${year}</span></div>
          <div class="cnt">${items.length} möte${items.length !== 1 ? 'n' : ''}</div>
        </div>
        <div class="entries">${rows}</div>
        <div class="add-row">
          <input type="text" class="kund-input" placeholder="Kund...">
          <select class="bokadav-input">
            <option value="">Bokad av...</option>
            <option value="Mikael">Mikael</option>
            <option value="Andreas">Andreas</option>
            <option value="Bernardo">Bernardo</option>
            <option value="Annan">Annan...</option>
          </select>
          <button class="add-btn">Lägg till</button>
        </div>
      </div>
    `;
  }).join('');

  board.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      btn.disabled = true;
      entries = entries.filter(e => e.id !== id);
      render();
      try {
        await deleteEntryRemote(id);
      } catch (e) {
        alert('Kunde inte ta bort mötet, kolla anslutningen.');
      }
    });
  });

  board.querySelectorAll('.col').forEach(col => {
    const year = parseInt(col.getAttribute('data-year'));
    const week = parseInt(col.getAttribute('data-week'));
    const kundInput = col.querySelector('.kund-input');
    const bokadAvSelect = col.querySelector('.bokadav-input');
    const addBtn = col.querySelector('.add-btn');

    async function trySubmit() {
      const kund = kundInput.value.trim();
      let bokadAv = bokadAvSelect.value;
      if (bokadAv === 'Annan') {
        bokadAv = prompt('Namn:') || '';
      }
      if (!kund) { kundInput.focus(); return; }
      if (!bokadAv) { bokadAvSelect.focus(); return; }

      addBtn.disabled = true;
      addBtn.textContent = 'Lägger till...';

      const entry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        year, week, kund, bokadAv
      };

      try {
        await addEntryRemote(entry);
        entries.push(entry);
        render();
        const newCol = board.querySelector(`.col[data-year="${year}"][data-week="${week}"] .kund-input`);
        if (newCol) newCol.focus();
      } catch (e) {
        alert('Kunde inte spara mötet, kolla anslutningen och försök igen.');
        addBtn.disabled = false;
        addBtn.textContent = 'Lägg till';
      }
    }

    addBtn.addEventListener('click', trySubmit);
    kundInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (bokadAvSelect.value) { trySubmit(); }
        else { bokadAvSelect.focus(); }
      }
    });
    bokadAvSelect.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') trySubmit();
    });
  });

  const curEl = board.querySelector('.col.current');
  if (curEl) curEl.scrollIntoView({ behavior: 'instant', inline: 'center', block: 'nearest' });
}

(async () => {
  const result = await loadEntries();
  if (result === null) {
    document.getElementById('board').innerHTML =
      '<div class="loading">Kunde inte hämta möten. Ladda om sidan eller kolla internetanslutningen.</div>';
    return;
  }
  entries = result;
  render();
})();
</script>
</body>
</html>
