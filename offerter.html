<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offerter — Commercial Insights</title>
<style>
  :root {
    --primary: #C77DCC;
    --dark: #3D1A6E;
    --bg: #F7F5FA;
    --card: #FFFFFF;
    --text: #2A1E3D;
    --muted: #8A7A9E;
    --border: #E5DEEF;
    --green: #3D8B5F;
    --green-bg: #E8F5EC;
    --red: #C0392B;
    --red-bg: #FBEAE8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  h1 { font-size: 21px; color: var(--dark); margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }

  .total {
    background: var(--dark);
    color: white;
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    min-width: 180px;
  }
  .total .num { font-size: 22px; font-weight: 700; line-height: 1; }
  .total .lbl { font-size: 11.5px; opacity: 0.85; margin-top: 2px; }

  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; }
  .col {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-width: 260px;
    max-width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .col-head { padding: 12px 14px 10px; border-bottom: 2px solid var(--border); }
  .col-head.open { border-bottom-color: var(--primary); }
  .col-head.won { border-bottom-color: var(--green); }
  .col-head.lost { border-bottom-color: var(--red); }
  .col-head .name { font-weight: 700; font-size: 14.5px; }
  .col-head.open .name { color: var(--dark); }
  .col-head.won .name { color: var(--green); }
  .col-head.lost .name { color: var(--red); }
  .col-head .cnt { color: var(--muted); font-size: 12px; margin-top: 1px; }

  .entries { padding: 10px 10px 4px; }

  .offer-card {
    background: #FCFBFE;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .offer-card.won, .offer-card.lost { opacity: 0.85; }
  .offer-row { display: flex; justify-content: space-between; align-items: baseline; }
  .offer-row .kund { font-weight: 700; font-size: 14px; }
  .offer-row .belopp { font-weight: 700; font-size: 14px; }
  .offer-desc { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .offer-meta {
    display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--muted); margin-top: 8px;
  }
  .offer-actions { display: flex; gap: 6px; margin-top: 10px; }
  .offer-actions button {
    flex: 1; font-size: 12px; padding: 6px; border: none;
    border-radius: 7px; cursor: pointer; font-weight: 600;
  }
  .btn-won { background: var(--green-bg); color: var(--green); }
  .btn-lost { background: var(--red-bg); color: var(--red); }
  .btn-reopen { background: #F2EEF7; color: var(--dark); }
  .btn-del { background: none; color: var(--muted); flex: 0 0 auto; padding: 6px 10px; }
  .btn-del:hover { color: var(--red); }

  .add-row { padding: 4px 10px 14px; border-top: 1px dashed var(--border); margin-top: 4px; }
  .add-row input, .add-row select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 7px; font-size: 13px; background: #FCFBFE;
    color: var(--text); margin-bottom: 6px;
  }
  .add-row input:focus, .add-row select:focus { outline: none; border-color: var(--primary); }
  .add-row input::placeholder { color: #C4B8D6; }
  .add-btn {
    width: 100%; padding: 8px; border: none; border-radius: 7px;
    background: var(--dark); color: white; font-size: 13px;
    font-weight: 600; cursor: pointer; margin-top: 2px;
  }
  .add-btn:hover { background: #2c1354; }
  .add-btn:disabled { opacity: 0.6; }

  .loading { color: var(--muted); font-size: 14px; padding: 20px; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 4px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Offerter</h1>
      <div class="sub">Lägg in nya offerter, markera vunna eller förlorade</div>
    </div>
    <div class="total">
      <div class="num" id="totalNum">0 kr</div>
      <div class="lbl">ute i öppna offerter</div>
    </div>
  </div>

  <div class="board" id="board">
    <div class="loading">Laddar...</div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyHnb9FanBl6z2lvRJW2dNlyyZJrP4w1Qc9GKBPYIn7U7s-srJo8sByzHaiA7cJE5FIjg/exec';
let entries = [];

function fmtKr(n) {
  return Math.round(n).toLocaleString('sv-SE') + ' kr';
}

function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function loadEntries() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    return data.map(e => ({
      id: e.id, kund: e.kund, vadOffererat: e.vadOffererat,
      belopp: Number(e.belopp), ansvarig: e.ansvarig,
      datum: e.datum, status: e.status || 'oppen'
    }));
  } catch (e) {
    console.error('Kunde inte hämta offerter', e);
    return null;
  }
}

async function addEntryRemote(entry) {
  await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'add', ...entry })
  });
}

async function updateStatusRemote(id, status) {
  await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'update', id, status })
  });
}

async function deleteEntryRemote(id) {
  await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'delete', id })
  });
}

function offerCardHtml(item) {
  const statusClass = item.status === 'vunnen' ? 'won' : item.status === 'forlorad' ? 'lost' : '';
  let actions = '';
  if (item.status === 'oppen') {
    actions = `
      <div class="offer-actions">
        <button class="btn-won" data-id="${item.id}" data-status="vunnen">Vunnen</button>
        <button class="btn-lost" data-id="${item.id}" data-status="forlorad">Förlorad</button>
        <button class="btn-del" data-id="${item.id}" title="Ta bort">✕</button>
      </div>`;
  } else {
    actions = `
      <div class="offer-actions">
        <button class="btn-reopen" data-id="${item.id}" data-status="oppen">Återöppna</button>
        <button class="btn-del" data-id="${item.id}" title="Ta bort">✕</button>
      </div>`;
  }
  return `
    <div class="offer-card ${statusClass}">
      <div class="offer-row">
        <span class="kund">${escapeHtml(item.kund)}</span>
        <span class="belopp">${fmtKr(item.belopp)}</span>
      </div>
      <div class="offer-desc">${escapeHtml(item.vadOffererat)}</div>
      <div class="offer-meta">
        <span>${escapeHtml(item.ansvarig)}</span>
        <span>${fmtDate(item.datum)}</span>
      </div>
      ${actions}
    </div>
  `;
}

function render() {
  const open = entries.filter(e => e.status === 'oppen');
  const won = entries.filter(e => e.status === 'vunnen');
  const lost = entries.filter(e => e.status === 'forlorad');
  const openSum = open.reduce((s, e) => s + e.belopp, 0);
  const wonSum = won.reduce((s, e) => s + e.belopp, 0);
  const lostSum = lost.reduce((s, e) => s + e.belopp, 0);

  document.getElementById('totalNum').textContent = fmtKr(openSum);

  const board = document.getElementById('board');
  board.innerHTML = `
    <div class="col">
      <div class="col-head open">
        <div class="name">Öppna</div>
        <div class="cnt">${open.length} st · ${fmtKr(openSum)}</div>
      </div>
      <div class="entries" id="col-open">
        ${open.map(offerCardHtml).join('') || '<div class="empty">Inga öppna offerter.</div>'}
      </div>
      <div class="add-row">
        <input type="text" id="new-kund" placeholder="Kund...">
        <input type="text" id="new-vad" placeholder="Vad offererat...">
        <input type="number" id="new-belopp" placeholder="Belopp (kr)">
        <select id="new-ansvarig">
          <option value="">Ansvarig...</option>
          <option value="Mikael">Mikael</option>
          <option value="Andreas">Andreas</option>
          <option value="Bernardo">Bernardo</option>
          <option value="Annan">Annan...</option>
        </select>
        <input type="date" id="new-datum">
        <button class="add-btn" id="addBtn">Lägg till</button>
      </div>
    </div>

    <div class="col">
      <div class="col-head won">
        <div class="name">Vunna</div>
        <div class="cnt">${won.length} st · ${fmtKr(wonSum)}</div>
      </div>
      <div class="entries">
        ${won.map(offerCardHtml).join('') || '<div class="empty">Inga vunna offerter än.</div>'}
      </div>
    </div>

    <div class="col">
      <div class="col-head lost">
        <div class="name">Förlorade</div>
        <div class="cnt">${lost.length} st · ${fmtKr(lostSum)}</div>
      </div>
      <div class="entries">
        ${lost.map(offerCardHtml).join('') || '<div class="empty">Inga förlorade offerter.</div>'}
      </div>
    </div>
  `;

  document.getElementById('new-datum').valueAsDate = new Date();

  board.querySelectorAll('[data-status]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      const status = btn.getAttribute('data-status');
      btn.disabled = true;
      const entry = entries.find(e => e.id === id);
      if (entry) entry.status = status;
      render();
      try {
        await updateStatusRemote(id, status);
      } catch (e) {
        alert('Kunde inte uppdatera, kolla anslutningen.');
      }
    });
  });

  board.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      entries = entries.filter(e => e.id !== id);
      render();
      try {
        await deleteEntryRemote(id);
      } catch (e) {
        alert('Kunde inte ta bort, kolla anslutningen.');
      }
    });
  });

  const addBtn = document.getElementById('addBtn');
  addBtn.addEventListener('click', async () => {
    const kund = document.getElementById('new-kund').value.trim();
    const vad = document.getElementById('new-vad').value.trim();
    const belopp = parseFloat(document.getElementById('new-belopp').value);
    let ansvarig = document.getElementById('new-ansvarig').value;
    const datum = document.getElementById('new-datum').value;

    if (ansvarig === 'Annan') ansvarig = prompt('Namn:') || '';

    if (!kund) { document.getElementById('new-kund').focus(); return; }
    if (!vad) { document.getElementById('new-vad').focus(); return; }
    if (!belopp || belopp <= 0) { document.getElementById('new-belopp').focus(); return; }
    if (!ansvarig) { document.getElementById('new-ansvarig').focus(); return; }
    if (!datum) { document.getElementById('new-datum').focus(); return; }

    addBtn.disabled = true;
    addBtn.textContent = 'Lägger till...';

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      kund, vadOffererat: vad, belopp, ansvarig, datum, status: 'oppen'
    };

    try {
      await addEntryRemote(entry);
      entries.push(entry);
      render();
    } catch (e) {
      alert('Kunde inte spara offerten, kolla anslutningen och försök igen.');
      addBtn.disabled = false;
      addBtn.textContent = 'Lägg till';
    }
  });
}

(async () => {
  const result = await loadEntries();
  if (result === null) {
    document.getElementById('board').innerHTML =
      '<div class="loading">Kunde inte hämta offerter. Ladda om sidan eller kolla internetanslutningen.</div>';
    return;
  }
  entries = result;
  render();
})();
</script>
</body>
</html>
